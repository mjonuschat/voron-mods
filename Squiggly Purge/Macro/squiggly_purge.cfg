[gcode_macro SQUIGGLY_PURGE]
gcode:
    # Mathematical constants
    {% set TAU = 6.28318 %}
    {% set PI = 3.14159 %}
    {% set FACTORIALS = [1, 2, 24, 720, 40320, 3628800, 479001600, 87178291200, 20922789888000] %}
    
    # Base macro parameters
    {% set prime_line_steps = params.STEPS|default(16)|int %}
    {% set prime_line_periods = params.PERIODS|default(10)|int %}
    {% set prime_line_amplitude = params.AMPLITUDE|default(5.0)|float %}
    {% set prime_line_period_length = params.PERIOD_LENGTH|default(5.0)|float %}
    {% set prime_line_purge_distance = params.PURGE_LENGTH|default(100.0)|float %}
    {% set prime_line_flowrate = params.FLOWRATE|default(10.0)|float %}
    {% set prime_line_height = params.LINE_HEIGHT|default(0.6)|float %}
    {% set prime_line_squish_factor = params.SQUISH_FACTOR|default(0.8)|float %}
    {% set solver_mode = params.LINE_WIDTH is defined %}
    {% set prime_line_unretract_length = params.UNRETRACT_LENGTH|default(5.0)|float %}
    {% set prime_line_direction = params.LINE_DIRECTION|default("X")|string|upper %}
    {% set prime_line_margin = params.LINE_MARGIN|default(10.0)|float %} # Used only in adaptive mode
    {% set prime_line_adaptive = params.ADAPTIVE_MODE|default(1)|int %}
    {% set prime_line_x_offset = params.ADAPTIVE_X_OFFSET|default(0.0)|float %} # Used only in adaptive mode
    {% set prime_line_y_offset = params.ADAPTIVE_Y_OFFSET|default(0.0)|float %} # Used only in adaptive mode
    {% set verbose = params.VERBOSE|default(1)|int %}

    # Validate parameters to avoid division by zero during extrusion calculations
    {% if prime_line_steps < 1 or prime_line_periods < 1 %}
        {action_raise_error("SQUIGGLY_PURGE: STEPS and PERIODS must be >= 1 (got STEPS=%d, PERIODS=%d)" % (prime_line_steps, prime_line_periods))}
    {% endif %}
    {% if prime_line_squish_factor <= 0.0 or prime_line_squish_factor > 1.0 %}
        {action_raise_error("SQUIGGLY_PURGE: SQUISH_FACTOR must be greater than 0 and at most 1 (got %.2f)" % prime_line_squish_factor)}
    {% endif %}
    {% if solver_mode and params.LINE_WIDTH|float <= 0.0 %}
        {action_raise_error("SQUIGGLY_PURGE: LINE_WIDTH must be greater than 0 (got %s)" % params.LINE_WIDTH)}
    {% endif %}
    {% if prime_line_amplitude < 0 %}
        {action_raise_error("SQUIGGLY_PURGE: AMPLITUDE must be >= 0 (got %.4f)" % prime_line_amplitude)}
    {% elif prime_line_direction == "X" and prime_line_amplitude > printer.toolhead.axis_maximum.y - printer.toolhead.axis_minimum.y %}
        {action_raise_error("SQUIGGLY_PURGE: AMPLITUDE %.4f exceeds the Y-axis travel span" % prime_line_amplitude)}
    {% elif prime_line_direction == "Y" and prime_line_amplitude > printer.toolhead.axis_maximum.x - printer.toolhead.axis_minimum.x %}
        {action_raise_error("SQUIGGLY_PURGE: AMPLITUDE %.4f exceeds the X-axis travel span" % prime_line_amplitude)}
    {% endif %}

    # If the SIZE parameter is defined and not a dummy placeholder, we use it to do the adaptive bed mesh logic
    {% set coordinates_found = False %}
    {% if params.SIZE is defined and params.SIZE != "0_0_0_0" %}
        {% set xMinSpec, yMinSpec, xMaxSpec, yMaxSpec = params.SIZE.split('_')|map('trim')|map('float') %}
        {% set coordinates_found = True %}
    {% elif printer.exclude_object is defined %}
        {% if printer.exclude_object.objects %}
            # Else if SIZE is not defined, we fallback to use the [exclude_object] tags
            # This method is derived from Kyleisah KAMP repository: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging)
            {% set eo_points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
            {% set xMinSpec = eo_points|map(attribute=0)|min %}
            {% set yMinSpec = eo_points|map(attribute=1)|min %}
            {% set xMaxSpec = eo_points|map(attribute=0)|max %}
            {% set yMaxSpec = eo_points|map(attribute=1)|max %}
            {% set coordinates_found = True %}
        {% endif %}
    {% endif %}

    # We get the default prime line position parameters
    {% set prime_line_x = params.START_X|default(5.0)|float %}
    {% set prime_line_y = params.START_Y|default(3.5)|float %}
    {% set center_x, center_y = [printer.toolhead.axis_maximum.x / 2, printer.toolhead.axis_maximum.y / 2]|map("float") %}

    # Account for the amplitude (height) of the purge line
    {% if prime_line_direction == "X" %}
        {% set offset_x, offset_y = 0, prime_line_amplitude/2 %}
    {% else %}
        {% set offset_x, offset_y = prime_line_amplitude/2, 0 %}
    {% endif %}

    # If first layer coordinates are retrieved and adaptive mode is enabled, then we replace the coordinates to
    # do an adaptive purge while being careful to have the line stay on the bed when the first layer
    # is in an opposite bed quadrant than the prime line initial coordinates (due to mirrored coordinates from center axes)...
    {% if coordinates_found and prime_line_adaptive == 1 %}
        {% set prime_line_x = 2*center_x - prime_line_x if (prime_line_x > center_x and xMaxSpec < center_x) or (prime_line_x < center_x and xMinSpec > center_x) 
                               else prime_line_x %}
        {% set prime_line_y = 2*center_y - prime_line_y if (prime_line_y > center_y and yMaxSpec < center_y) or (prime_line_y < center_y and yMinSpec > center_y) 
                               else prime_line_y %}
        {% set prime_line_x = [[prime_line_x, xMinSpec - prime_line_margin - offset_x]|max, xMaxSpec + prime_line_margin + offset_x]|min %}
        {% set prime_line_y = [[prime_line_y, yMinSpec - prime_line_margin - offset_y]|max, yMaxSpec + prime_line_margin + offset_y]|min %}
        # Apply the offsets and reserve room for the squiggle amplitude on its perpendicular axis
        {% if prime_line_direction == "X" %}
            {% set prime_line_x = [[prime_line_x + prime_line_x_offset, printer.toolhead.axis_minimum.x]|max, printer.toolhead.axis_maximum.x]|min %}
            {% set prime_line_y = [[prime_line_y + prime_line_y_offset, printer.toolhead.axis_minimum.y]|max, printer.toolhead.axis_maximum.y - prime_line_amplitude]|min %}
        {% else %}
            {% set prime_line_x = [[prime_line_x + prime_line_x_offset, printer.toolhead.axis_minimum.x]|max, printer.toolhead.axis_maximum.x - prime_line_amplitude]|min %}
            {% set prime_line_y = [[prime_line_y + prime_line_y_offset, printer.toolhead.axis_minimum.y]|max, printer.toolhead.axis_maximum.y]|min %}
        {% endif %}
    {% endif %}

    # Choose the way of printing the primeline (in + or -) alongside the direction to avoid going outside the bed boundaries
    {% set prime_line_way = -1 if (prime_line_direction == "X" and prime_line_x > center_x) or (prime_line_direction == "Y" and prime_line_y > center_y) else 1 %}

    {% set extruder_config = printer["configfile"].config["extruder"] %}
    {% set filament_diameter = extruder_config["filament_diameter"]|float %}
    {% set filament_area = PI * (filament_diameter / 2)**2 %}

    # The printer.configfile.config dict only contains values explicitly set by the user.
    # Klipper's own default for max_extrude_cross_section is 4.0 * nozzle_diameter^2, so we
    # replicate that here when the user has not configured it, rather than raising an error.
    {% if "max_extrude_cross_section" in extruder_config %}
        {% set max_extrude_cross_section = extruder_config["max_extrude_cross_section"]|float %}
    {% else %}
        {% set nozzle_diameter = extruder_config["nozzle_diameter"]|float %}
        {% set max_extrude_cross_section = 4.0 * nozzle_diameter**2 %}
        {action_respond_info("SQUIGGLY_PURGE: [extruder] max_extrude_cross_section is not configured; falling back to the Klipper default of %.4f mm^2." % max_extrude_cross_section)}
    {% endif %}

    # In solver mode (LINE_WIDTH given) the bead is sized against the real nozzle gap
    # (LINE_HEIGHT * SQUISH_FACTOR); legacy mode keeps the historical full-height math.
    {% set effective_height = prime_line_height * prime_line_squish_factor if solver_mode else prime_line_height %}

    {% if solver_mode %}
        {% set prime_line_width_target = params.LINE_WIDTH|float %}
        # A width the extruder cannot legally produce is clamped down and compensated
        # with a longer line, keeping the full purge volume.
        {% set solver_width_limit = 0.98 * max_extrude_cross_section / effective_height %}
        {% if prime_line_width_target > solver_width_limit %}
            {action_respond_info("SQUIGGLY_PURGE: LINE_WIDTH=%.2f mm exceeds what max_extrude_cross_section (%.2f mm^2) allows at a %.2f mm gap; clamping the width to %.2f mm and extending the line to keep the purge volume." % (prime_line_width_target, max_extrude_cross_section, effective_height, solver_width_limit))}
            {% set prime_line_width_target = solver_width_limit %}
        {% endif %}
        # Reject requests the 0.75 height/width abort would reject anyway - checked up
        # front, with headroom for ceil-rounding and per-period drift, so the advice can
        # name the right knobs while they are still adjustable.
        {% if (effective_height / prime_line_width_target) >= 0.73 %}
            {action_raise_error("SQUIGGLY_PURGE: LINE_WIDTH=%.2f mm is too narrow for a %.2f mm nozzle gap (height/width must stay below 0.75, with margin for rounding). Increase LINE_WIDTH, decrease LINE_HEIGHT, or raise max_extrude_cross_section if the width was clamped." % (prime_line_width_target, effective_height))}
        {% endif %}
        # Arc length of a single fresh period. Later periods drift slightly longer
        # (truncated TAU + float modulo in the Taylor cosine), so this estimate errs
        # thin: the solved width never exceeds the request.
        {% set one = namespace(cur_y=0.0, len=0.0, cos=0.0) %}
        {% for step in range(1, prime_line_steps + 1) %}
            {% set sign = cycler(1.0, -1.0) %}
            {% set one.cos = 0.0 %}
            {% set rad_angle = step / prime_line_steps * TAU %}
            {% for i in range(0, FACTORIALS|length) %}
                {% set one.cos = one.cos + sign.next() * ((rad_angle%TAU)**(2*i) / FACTORIALS[i]) %}
            {% endfor %}
            # Keep approximation error from extending the waveform beyond the envelope reserved above
            {% set dist_y_unclamped = prime_line_amplitude * (0.5 - (0.5 * one.cos)) %}
            {% set dist_y = [[dist_y_unclamped, 0.0]|max, prime_line_amplitude]|min %}
            {% set one.len = one.len + ((prime_line_period_length/prime_line_steps)**2 + (dist_y - one.cur_y)**2)**0.5 %}
            {% set one.cur_y = dist_y %}
        {% endfor %}

        {% set target_cross_section = prime_line_width_target * effective_height %}
        {% set required_length = (prime_line_purge_distance * filament_area) / target_cross_section %}
        {% set periods_needed = [(required_length / one.len)|round(0, 'ceil')|int, 1]|max %}

        # The path may not fit: cap by bed space in the travel direction and by an
        # explicitly passed PERIODS. Width wins over volume - purge is reduced instead.
        {% if prime_line_direction == "X" %}
            {% set travel_space = (printer.toolhead.axis_maximum.x - prime_line_x) if prime_line_way == 1 else prime_line_x %}
        {% else %}
            {% set travel_space = (printer.toolhead.axis_maximum.y - prime_line_y) if prime_line_way == 1 else prime_line_y %}
        {% endif %}
        {% set periods_cap = (travel_space / prime_line_period_length)|int %}
        {% set cap_reason = "available bed space" %}
        {% if params.PERIODS is defined and prime_line_periods < periods_cap %}
            {% set periods_cap = prime_line_periods %}
            {% set cap_reason = "the PERIODS parameter" %}
        {% endif %}
        {% if periods_cap < 1 %}
            {action_raise_error("SQUIGGLY_PURGE: not enough room for a single %.1f mm period between the start position and the edge of the bed." % prime_line_period_length)}
        {% endif %}

        {% set prime_line_periods = [periods_needed, periods_cap]|min %}
        {% if prime_line_periods < periods_needed %}
            {% set capped_purge = (target_cross_section * prime_line_periods * one.len) / filament_area %}
            {action_respond_info("SQUIGGLY_PURGE: %s limits the line to %d periods; honoring LINE_WIDTH=%.2f mm and reducing purge from %.1f mm to %.1f mm of filament." % (cap_reason, prime_line_periods, prime_line_width_target, prime_line_purge_distance, capped_purge))}
            {% set prime_line_purge_distance = capped_purge %}
        {% endif %}
    {% endif %}

    # Calculate steps
    {% set steps = [] %}
    {% set state = namespace(cur_y=prime_line_y, prime_line_length=0.0, cos=0.0) %}

    {% for step in range(1, prime_line_periods * prime_line_steps + 1) %}
        {% set sign = cycler(1.0, -1.0) %}
        {% set state.cos = 0.0 %}
        {% set rad_angle = step / prime_line_steps * TAU %}
        {% for i in range(0, FACTORIALS|length) %}
            {% set cos_step = sign.next() * ((rad_angle%TAU)**(2*i) / FACTORIALS[i]) %}
            {% set state.cos = state.cos + cos_step %}
        {% endfor %}
        # Keep approximation error from extending the waveform beyond the envelope reserved above
        {% set dist_y_unclamped = prime_line_amplitude * (0.5 - (0.5 * state.cos)) %}
        {% set dist_y = [[dist_y_unclamped, 0.0]|max, prime_line_amplitude]|min %}
        {% set rel_x = prime_line_period_length/prime_line_steps %}
        {% set rel_y = prime_line_y + dist_y - state.cur_y %}
        {% set e_length = (rel_x**2 + rel_y**2)**0.5 %}
        {% set state.cur_y = state.cur_y + rel_y %}
        {% set state.prime_line_length = state.prime_line_length + e_length %}
        {% set _ = steps.append((rel_x, rel_y, e_length)) %}
    {% endfor %}

    # We first compute the width of the prime line
    {% set purge_volume = prime_line_purge_distance * filament_area %}
    {% set line_width = purge_volume / (effective_height * state.prime_line_length) %}

    # Then we check that the prime line cross section will not be problematic (exceeding Klipper max_extrude_cross_section)
    # or, if it's the case, we warn the user and add a correction to the length of filament to be purged
    {% set cross_section_corrected = False %}
    {% if (effective_height * line_width) > max_extrude_cross_section %}
        {% if verbose %}
            {action_respond_info("The prime_line_purge_distance of %.4f mm is too high and will exceed the max_extrude_cross_section!" % prime_line_purge_distance)}
        {% endif %}
        {% set prime_line_purge_distance = 0.98 * (max_extrude_cross_section * state.prime_line_length) / filament_area %}
        {% set purge_volume = prime_line_purge_distance * filament_area %}
        {% set line_width = purge_volume / (effective_height * state.prime_line_length) %}
        {% set cross_section_corrected = True %}
        {% if verbose %}
            {action_respond_info("Corrected the prime_line_purge_distance to %.4f mm" % prime_line_purge_distance)}
        {% endif %}
    {% endif %}

    # Validate the height to width ratio: a bead taller than 3/4 of its width tends to
    # detach from the bed. 0.75 matches the limit slicers enforce for first layers.
    {% if (effective_height / line_width) >= 0.75 %}
        {% if solver_mode %}
            {action_raise_error("SQUIGGLY_PURGE: the solved line is only %.2f mm wide at a %.2f mm gap (height/width must stay below 0.75) - the purge volume is too small for even one period at this width. Increase PURGE_LENGTH, decrease LINE_HEIGHT, or use a shorter PERIOD_LENGTH." % (line_width, effective_height))}
        {% elif cross_section_corrected %}
            {action_raise_error("SQUIGGLY_PURGE: max_extrude_cross_section (%.2f mm^2) limits the line width to %.2f mm, which is too narrow for a %.2f mm high line (height/width must stay below 0.75). Decrease LINE_HEIGHT or raise max_extrude_cross_section in [extruder]." % (max_extrude_cross_section, line_width, effective_height))}
        {% else %}
            {action_raise_error("SQUIGGLY_PURGE: a %.2f mm high x %.2f mm wide line is too tall and narrow to stick to the bed (height/width must stay below 0.75). Decrease LINE_HEIGHT, increase PURGE_LENGTH, or shorten the path (fewer PERIODS or a shorter PERIOD_LENGTH)." % (effective_height, line_width))}
        {% endif %}
    {% endif %}

    # Finally we compute the speed to get the correct flowrate for the prime line
    {% set speed = (prime_line_flowrate / (effective_height * line_width)) * 60 %}

    {% if solver_mode and verbose %}
        {action_respond_info("SQUIGGLY_PURGE: %d periods, %.1f mm path, %.2f mm wide bead at a %.2f mm nozzle gap, purging %.1f mm of filament (%.1f mm^3)." % (prime_line_periods, state.prime_line_length, line_width, effective_height, prime_line_purge_distance, purge_volume))}
    {% endif %}

    G91
    M83
    {% if (printer.toolhead.position.z < 5) %}
        G1 Z5 F600
    {% endif %}

    # Starting position
    G90
    G0 X{prime_line_x} Y{prime_line_y} F18000

    # Add some extra squish to the prime line
    G1 Z{prime_line_height*prime_line_squish_factor} F600

    # Add pressure in the nozzle
    G92 E0
    G1 E{prime_line_unretract_length} F300

    # Prime line
    G92 E0
    G91
    {% if prime_line_direction == "X" %}
        {% for x,y,e in steps %}
            G1 X{x*prime_line_way} Y{y} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% elif prime_line_direction == "Y" %}
        {% for y,x,e in steps %}
            G1 X{x} Y{y*prime_line_way} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% else %}
        { action_respond_error("Prime line direction is not valid. Choose either X or Y in the variables.cfg file!") }
    {% endif %}
    G90
    
    # Retract and Z-hop
    G92 E0
    G1 E-0.2 F2100
    G92 E0
    G91
    G1 Z3 F600
    G90

    # Additional small movement to get out of the line as some slicers directly emmit
    # a Z- move as a first step that make the toolhead crash back in the line and get dirty
    G91
    G1 X{5*prime_line_way if prime_line_direction == "X" else 5} Y{5 if prime_line_direction == "X" else 5*prime_line_way} F18000
    G90
    
    # Flushing Klipper's buffer to ensure the primeline sequence is done before continuing
    M400
